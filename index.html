<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>HSA Student QR Scanner</title>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"
    onerror="this.onerror=null;this.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #24324a;
      background: linear-gradient(
        145deg,
        #6557e8,
        #a657c5
      );
    }

    .card {
      width: min(620px, 100%);
      padding: 26px;
      text-align: center;
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 55px #251b6266;
    }

    h1 {
      margin: 5px 0 8px;
      color: #5144c9;
    }

    .subtitle {
      margin-bottom: 18px;
      color: #69738a;
      font-size: 18px;
    }

    #reader {
      width: 100%;
      min-height: 300px;
      overflow: hidden;
      color: white;
      background: #111;
      border-radius: 20px;
    }

    #reader video {
      border-radius: 20px;
    }

    button {
      margin: 18px auto 8px;
      padding: 18px 28px;
      color: white;
      background: #20a464;
      border: 0;
      border-radius: 17px;
      box-shadow: 0 7px 0 #126b41;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      min-height: 55px;
      margin-top: 13px;
      padding: 13px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
    }

    .info {
      color: #5144c9;
      background: #eeecff;
    }

    .success {
      color: #147247;
      background: #ddf7e8;
    }

    .error {
      color: #a72f38;
      background: #ffe1e1;
    }

    .small {
      margin-top: 15px;
      color: #7a8293;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 17px;
      }

      .subtitle {
        font-size: 16px;
      }

      #reader {
        min-height: 260px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div style="font-size:60px">
      🎓📷
    </div>

    <h1>Student QR Scanner</h1>

    <div class="subtitle">
      Scan your permanent student card to open today’s assignment.
    </div>

    <div id="reader"></div>

    <button id="start">
      📷 Start Camera
    </button>

    <div id="message" class="message info">
      Press Start Camera, then choose Allow.
    </div>

    <div class="small">
      Harmony Science Academy • Student Learning Tool
    </div>
  </main>

  <script>
    /*
     * Only accept Google Apps Script URLs.
     */
    const ALLOWED_HOST =
      'script.google.com';

    /*
     * Only accept this verified deployment.
     */
    const ALLOWED_DEPLOYMENT_ID =
      'AKfycbx9JtbjTzy1yk93ugvnvuFrjZLajQSrUdn0MR2S5sSpThddhO2uxNMIVURhS5C6XiPs-g';

    let scanner = null;
    let done = false;

    const button =
      document.getElementById('start');

    const message =
      document.getElementById('message');

    function tell(text, type = 'info') {
      message.textContent = text;

      message.className =
        'message ' + type;
    }

    button.addEventListener(
      'click',
      startScanner
    );

    async function startScanner() {
      /*
       * Prevent repeated camera starts.
       */
      if (scanner) {
        return;
      }

      /*
       * Confirm the scanner library loaded.
       */
      if (typeof Html5Qrcode === 'undefined') {
        tell(
          'The scanner library was blocked by the school network.',
          'error'
        );

        return;
      }

      button.disabled = true;

      button.textContent =
        'Starting Camera…';

      tell(
        'Please choose Allow when the browser asks for camera access.',
        'info'
      );

      done = false;

      try {
        const cameras =
          await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error(
            'No camera was found.'
          );
        }

        /*
         * Prefer the rear camera on mobile devices.
         */
        const preferredCamera =
          cameras.find(camera => {
            return /back|rear|environment/i.test(
              camera.label
            );
          });

        const cameraId =
          preferredCamera
            ? preferredCamera.id
            : cameras[0].id;

        scanner =
          new Html5Qrcode('reader');

        await scanner.start(
          cameraId,

          {
            fps: 10,

            qrbox: function(
              width,
              height
            ) {
              const size =
                Math.floor(
                  Math.min(
                    width,
                    height
                  ) * 0.72
                );

              return {
                width: size,
                height: size
              };
            },

            aspectRatio: 1
          },

          onSuccessfulScan,

          function() {
            /*
             * Normal while searching for a QR code.
             */
          }
        );

        button.textContent =
          'Camera Running';

        tell(
          'Hold the student QR card inside the square.',
          'info'
        );
      } catch (error) {
        console.error(error);

        scanner = null;
        button.disabled = false;

        button.textContent =
          '📷 Try Camera Again';

        tell(
          'Camera error: ' +
          (error.name || 'Error') +
          ' — ' +
          (
            error.message ||
            'Unable to start camera.'
          ),
          'error'
        );
      }
    }

    async function onSuccessfulScan(
      scannedText
    ) {
      /*
       * Prevent duplicate scans.
       */
      if (done) {
        return;
      }

      try {
        const scannedUrl =
          new URL(scannedText);

        const studentToken =
          scannedUrl.searchParams.get('t') || '';

        /*
         * Accept path variations from Google,
         * but require the correct deployment ID.
         */
        const validCard =
          scannedUrl.protocol === 'https:' &&
          scannedUrl.hostname === ALLOWED_HOST &&
          scannedUrl.pathname.includes(
            ALLOWED_DEPLOYMENT_ID
          ) &&
          /^[a-f0-9]{64}$/i.test(
            studentToken
          );

        if (!validCard) {
          throw new Error(
            'Invalid student card.'
          );
        }

        done = true;

        tell(
          'Student card found! Opening assignment…',
          'success'
        );

        /*
         * Stop the camera before redirecting.
         */
        try {
          await scanner.stop();
          scanner.clear();
        } catch (stopError) {
          console.log(stopError);
        }

        scanner = null;

        /*
         * Open the Apps Script assignment.
         */
        window.location.replace(
          scannedUrl.href
        );
      } catch (error) {
        done = false;

        tell(
          'This is not a valid HSA student card. Try again.',
          'error'
        );
      }
    }
  </script>
</body>
</html>
